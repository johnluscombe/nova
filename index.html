<!doctype html>
<html>
    <head>
        <title><%= productName %></title>

        <meta charset="utf-8" />
        <meta name="description" content="<%= productDescription %>" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';<% if (ctx.dev) { %> connect-src 'self' ws://localhost:*; worker-src 'self' blob:;<% } %>" />

        <link
            rel="icon"
            type="image/png"
            sizes="128x128"
            href="icons/nova-128.png" />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="icons/nova-96.png" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="icons/nova-32.png" />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="icons/nova-16.png" />
        <link rel="icon" type="image/ico" href="nova.ico" />
    </head>
    <body>
        <!-- quasar:entry-point -->
    </body>
</html>
